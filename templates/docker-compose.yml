# Docker-Stack OHNE Caddy: Rauthy + Nextcloud(+DB/Redis) + Vaultwarden + Collabora.
# Jeder Dienst wird NUR auf 127.0.0.1 veroeffentlicht -> nur natives Caddy kommt ran.
# Ports muessen zur Caddyfile.native.tmpl passen: NC 8080, VW 8081, Rauthy 9091, Collabora 9980.
name: home_stack

services:
  rauthy:
    image: ghcr.io/sebadob/rauthy:${RAUTHY_TAG}
    restart: always
    user: "10001:10001"
    # Konfiguration komplett in rauthy-config/config.toml (seit v0.35 Pflicht).
    # Keine Rauthy-ENV-Variablen hier - ENV ueberschreibt TOML und der ENV-Parser
    # behandelt z. B. TRUSTED_PROXIES-Kommalisten als einen einzigen Eintrag.
    environment:
      - TZ=${TZ}
      - RUST_LOG=info
    volumes:
      - ./data/rauthy:/app/data              # DB (Hiqlite) + State; UID 10001
      - ./rauthy-bootstrap:/app/bootstrap:ro # Auto-Provisionierung (nur beim 1. Start)
      - ./rauthy-config/config.toml:/app/config.toml:ro # Pflicht seit v0.35
    ports:
      - "127.0.0.1:9091:8080"
    networks: [appnet]

  nextcloud:
    image: nextcloud:${NEXTCLOUD_TAG}
    restart: always
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${CLOUD_DOMAIN}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=${CLOUD_DOMAIN}
      - OVERWRITECLIURL=https://${CLOUD_DOMAIN}
      - TRUSTED_PROXIES=127.0.0.1 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
    volumes:
      - ./data/nextcloud/html:/var/www/html
      - ./data/nextcloud/data:/var/www/html/data
    ports:
      - "127.0.0.1:8080:80"
    networks: [appnet, dbnet]
    depends_on: [nextcloud-db, nextcloud-redis]

  nextcloud-db:
    image: mariadb:${MARIADB_TAG}
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MARIADB_DATABASE=nextcloud
      - MARIADB_USER=nextcloud
      - MARIADB_PASSWORD=${MYSQL_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ./data/nextcloud/db:/var/lib/mysql
    networks: [dbnet]

  nextcloud-redis:
    image: redis:${REDIS_TAG}
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks: [dbnet]

  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_TAG}
    restart: always
    environment:
      - DOMAIN=https://${VAULT_DOMAIN}
      - SIGNUPS_ALLOWED=${VW_SIGNUPS}  # Registrierung; steuerbar via 'setup.sh vaultwarden signups on|off'
      - ADMIN_TOKEN=${VW_ADMIN_TOKEN}
      - SSO_ENABLED=true
      - SSO_ONLY=false
      - SSO_CLIENT_ID=vaultwarden
      - SSO_CLIENT_SECRET=${VW_SSO_CLIENT_SECRET}
      - SSO_AUTHORITY=https://${AUTH_DOMAIN}/auth/v1/   # muss dem Rauthy-Issuer exakt entsprechen (inkl. /auth/v1/ und Slash)
      - SSO_PKCE=true
      - SSO_SCOPES=openid email profile offline_access
    volumes:
      - ./data/vaultwarden:/data
    ports:
      - "127.0.0.1:8081:80"
    networks: [appnet]

  collabora:
    image: collabora/code:${COLLABORA_TAG}
    restart: always
    environment:
      - TZ=${TZ}
      - server_name=${OFFICE_DOMAIN}
      - aliasgroup1=https://${CLOUD_DOMAIN}
      # SSL wird von Caddy terminiert (ssl.enable=false). DONT_GEN_SSL_CERT NICHT setzen:
      # coolwsd verlangt beim Start trotzdem /etc/coolwsd/ca-chain.cert.pem und stirbt
      # sonst mit Exit 78 - der Entrypoint muss die (ungenutzten) Zerts erzeugen.
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    # coolforkit richtet sein Jail per chroot ein und braucht dafuer diese Caps;
    # seccomp:unconfined, weil Dockers Default-Profil mount()/chroot blockt.
    # Ohne das crasht Collabora endlos ("Capability cap_sys_chroot is not set").
    cap_add: [MKNOD, CHOWN, FOWNER, SYS_CHROOT]
    security_opt: ["seccomp:unconfined"]
    ports:
      - "127.0.0.1:9980:9980"
    networks: [appnet]

networks:
  appnet:
  dbnet:
    internal: true
